# Soup config for HWK-Aali (owner's machine: RTX 3070 8GB)
# Purpose: local teacher + comparison model for Aali's tool-calling exam.
#
# 2026-10-06 BASE UPGRADE 1.5B -> 3B (owner directive: "make the brain bigger
#   and smarter"). Evidence first: the A/B (scripts/brain_ab.py, warm, same
#   harness) had the RAW 3B LOSING 3/6 to the tuned 1.5B (fabricated a file
#   listing, mixed English into Arabic) -> raw-bigger is not better, TUNED
#   bigger is the path. 3B at 4-bit QLoRA trains within the 8GB card with the
#   GPU free; max_length stays 768 (hard ceiling, in sync with
#   build_aali_sft_v2.py TRAIN_MAX_LENGTH). NOTE: the 1.5B base must STAY on
#   disk anyway - checkpoint-3933 (the live brain) loads on top of it.
base: D:/hwk-models/Qwen2.5-3B-Instruct
task: sft

data:
  train: D:/hwk-data/soup/sft_v2.jsonl
  format: chatml
  val_split: 0.05
  max_length: 768

training:
  epochs: 3
  lr: 2e-5
  batch_size: auto
  lora:
    r: 32
    alpha: 16
    target_modules: auto
  quantization: 4bit

output: D:/hwk-data/soup/tuned
