# Soup config for HWK-Aali (owner's machine: RTX 3070 8GB)
# Purpose: local teacher + comparison model for Aali's tool-calling exam.
#
# Phase 1 (now): local 1.5B instruct teacher — downloaded to D:/hwk-models
#   (scripts/soup_pipeline.py serves this exact folder for the baseline exam).
#   4bit QLoRA at max_length 768 fits the 8GB card WITH nothing else on it.
#   (1024 was tried on 2026-09-12 and CUDA-OOM'd at batch_size=1 - 768 is
#   the hard ceiling for this card; build_aali_sft_v2.py budgets every row
#   against TRAIN_MAX_LENGTH=768 - keep the two in sync.)
# Phase 2 (after Phase A finishes): optionally raise `base` to a 7B/8B instruct
#   model for a stronger teacher — profile first; it will NOT fit the 8GB card
#   next to a running server.
base: D:/hwk-models/Qwen2.5-1.5B-Instruct
task: sft

data:
  train: D:/hwk-data/soup/sft_v2.jsonl
  format: chatml
  val_split: 0.05
  max_length: 768

training:
  epochs: 3
  lr: 2e-5
  batch_size: auto
  lora:
    r: 32
    alpha: 16
    target_modules: auto
  quantization: 4bit

output: D:/hwk-data/soup/tuned
